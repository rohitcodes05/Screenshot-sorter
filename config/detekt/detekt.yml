build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false

style:
  UnusedImports:
    active: true
  UnusedPrivateMember:
    active: true
    allowedNames: '(_|ignored|expected)'
    ignoreAnnotated: ['Preview']
  UnusedPrivateProperty:
    active: true
    allowedNames: '(_|ignored|expected)'
  WildcardImport:
    active: true
    excludeImports:
      - 'java.util.*'
  UseCheckOrError:
    active: false
  LoopWithTooManyJumpStatements:
    active: false
  MagicNumber:
    active: false
  MaxLineLength:
    active: false
  ReturnCount:
    active: false

naming:
  FunctionNaming:
    active: true
    functionPattern: '([a-zA-Z][a-zA-Z0-9]*)|([A-Z][a-zA-Z0-9]*)'
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Z][A-Za-z0-9_]*'
  MatchingDeclarationName:
    active: false

potential-bugs:
  UnreachableCode:
    active: true
  EqualsWithHashCodeExist:
    active: true

complexity:
  LongParameterList:
    active: true
    functionThreshold: 12
    ignoreAnnotated: ['Composable']
  NestedBlockDepth:
    active: true
    threshold: 6
  TooManyFunctions:
    active: false
  LongMethod:
    active: false
  LargeClass:
    active: false
  ComplexCondition:
    active: false
  CyclomaticComplexMethod:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false
  PrintStackTrace:
    active: false
